name: Security Checks

# All code lives in labview/ and is Go (§2.1): one statically linked binary, no
# interpreter and no package manager at runtime. The scans are shaped around that:
#
#   * govulncheck replaces `npm audit` — it is the Go vulnerability database, and it
#     reports at *symbol* level, which is the only reading that can gate here (see
#     the job for why);
#   * CodeQL analyses `go` rather than `javascript-typescript`. The browser bundle
#     under internal/webui/dist is hand-authored and committed (§2.2), and `actions`
#     is included as a second language so these workflows are scanned too;
#   * Trivy scans the filesystem (Go module vulns, Dockerfile misconfig, secrets)
#     and the built image;
#   * the Docker image is built from ./labview.

on:
  push:
    branches: [ main ]
    paths:
      - 'labview/**'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'labview/**'
      - '.github/workflows/security.yml'
  schedule:
    # Daily full scan (runs regardless of the path filters above). This is the step
    # that matters most for a Go binary: the dependency set barely changes, but the
    # vulnerability database does, so yesterday's green is not today's.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labview
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The toolchain the Dockerfile ships, NOT go.mod's floor — keep this in step with
      # labview/Dockerfile's build stage. govulncheck reports standard-library advisories
      # at symbol level alongside module ones, so whichever Go is installed here *is* the
      # dependency under audit for the largest dependency this program has. Reading the
      # floor out of go.mod pointed that at Go 1.23.0 and the job reported 28 reachable
      # stdlib advisories — accurately: Go 1.23 is end of life, so there was no patched
      # 1.23 to move to and no version of this step could pass. Auditing a toolchain the
      # image does not ship would be the mirror of that mistake, so this tracks the image.
      #
      # check-latest is what makes '1.26' mean the same thing here as `golang:1.26-alpine`
      # means in the Dockerfile: the newest 1.26.x, resolved now. Without it setup-go takes
      # any 1.26.x already in the runner's tool cache and never looks further, so the pin
      # silently froze on the runner image's Go while the security releases moved past it —
      # the audit reported five reachable stdlib advisories (net/url, crypto/tls, net/http,
      # encoding/asn1) that were all fixed in the patch it declined to fetch. A stdlib
      # advisory is normally one patch release wide, so a stale patch is the one way this
      # job can be red for a reason that has nothing to say about this code.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: labview/go.sum

      - name: Dependencies are tidy and their hashes match
        run: |
          go mod tidy -diff
          go mod verify

      # Gating, and deliberately the default *symbol-level* scan: govulncheck reports
      # only advisories whose vulnerable functions this binary can actually reach. Both
      # the module requirements and the standard library are in scope — see the Go
      # version above, which is why it is the image's and not go.mod's.
      #
      # That distinction is load-bearing here rather than a convenience. §2.1 pins
      # golang.org/x/crypto to v0.40.0 because it is the last release whose own go
      # directive is still 1.23.0, and every advisory currently open against v0.40.0
      # is in golang.org/x/crypto/ssh — a subtree this program does not import, since
      # the only thing it wants from that module is bcrypt (§19). A `-scan module`
      # gate would therefore be red permanently, and the only way to clear it would be
      # v0.52.0, which raises the Go floor to 1.25 and breaks §2.1. Symbol level asks
      # the question that has an actionable answer: is any of it reachable from this
      # code? When that answer changes, this step fails.
      #
      # @latest and not a pinned version, for the same reason trivy-action is tracked
      # at master below: a scanner one release behind is a scanner missing the newest
      # advisory, and reproducibility is not what is wanted from this particular tool.
      - name: govulncheck (reachable vulnerabilities, gating)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Informational: the same scan with the unreachable advisories listed, so one
      # that is being carried deliberately stays visible in the log and can be judged
      # rather than forgotten. Not gating, for the reason above.
      - name: govulncheck (including unreachable advisories, informational)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The shipped toolchain again, for the same reason as the audit job above: CodeQL
      # analyses what the compiler gives it, so a stdlib two years behind the image's
      # would be analysed instead of the one that ships — and check-latest for the same
      # reason too, so the two jobs cannot end up reading different 1.26.x stdlibs.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: labview/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Manual rather than autobuild: go.mod is in labview/, not at the repository
      # root, and being explicit here means a CodeQL run cannot quietly analyse
      # nothing because the autobuilder failed to find the module.
      - name: Build (Go)
        if: matrix.language == 'go'
        working-directory: labview
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy (vuln, misconfig, secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'labview'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

  docker-security:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t labview:test ./labview

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'labview:test'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true
