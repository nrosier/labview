name: Docker Build and Push

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests targeting the main branch

# The build needs no write access to the repo; the Docker Hub login uses its own
# secrets rather than GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Gate: a broken build or a reverted fix must not reach Docker Hub. The smoke
  # suite runs the whole pipeline against fixtures/, including the edge cases that
  # are written to fail if their fix is backed out (see IMPLEMENTATION.md).
  test:
    name: Typecheck & smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labview
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: labview/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server + web)
        run: npm run typecheck

      - name: Smoke test (pipeline against fixtures)
        run: npm run smoke

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # All application code lives in labview/, so the build context is scoped
          # there. The Dockerfile COPYs package.json, src/, web/ and scripts/ as
          # context-relative paths, so a repo-root context finds neither the
          # Dockerfile nor those directories.
          context: ./labview
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/labview:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/labview:${{ github.sha }}