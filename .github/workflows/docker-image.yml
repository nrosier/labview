name: Docker Build and Push

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests targeting the main branch

# The build needs no write access to the repo; the Docker Hub login uses its own
# secrets rather than GITHUB_TOKEN.
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  # Gate: a broken build or a reverted fix must not reach Docker Hub. `go test ./...`
  # is the whole gate, because the corpus (§23, internal/corpus) is an ordinary Go
  # test — it runs the real pipeline over the seven fixture roots with the Docker,
  # identity-provider, proxy and probe transports injected, and every fixture under
  # fixtures/edge is written to fail if its fix is backed out (see IMPLEMENTATION.md).
  # The same command also runs the three UI checks §23 requires to gate CI: payload
  # coverage, card destinations, and the diagram text export.
  #
  # `go test` cannot cover the last two steps, though: it sees §2.2's committed browser
  # bundle only as bytes to embed. Those steps parse it and run it against a real
  # payload, and they are in this job rather than a separate one so build-and-push
  # needs no new edge.
  test:
    name: Build, vet, corpus & bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labview
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The toolchain the Dockerfile's build stage uses, so the corpus runs against the
      # standard library that actually ships. Not go.mod's floor: that is a minimum to
      # stay compatible with (§2.1, "1.23 or later") and is enforced by the `go` directive
      # at compile time, not by the choice of toolchain. The floor-compat job below is
      # what checks the declaration is still true; testing on the floor as well would only
      # mean the tests never touch the stdlib the image contains.
      #
      # check-latest for that last clause to stay true: without it setup-go stops at any
      # 1.26.x sitting in the runner's tool cache, which is the runner image's Go and not
      # the one `golang:1.26-alpine` resolves to — so the corpus would run against a stdlib
      # the image stopped containing, and against a different one than the security
      # workflow's govulncheck gate reads. The floor job below is the exception and keeps
      # go-version-file: the whole point there is to pin, not to track.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: labview/go.sum

      # §2.1 caps the runtime dependency surface at a YAML parser, bcrypt and JWT
      # verification. A stray `// indirect`, a dropped requirement or an unrecorded
      # hash all show up here, and -diff reports them without writing to go.mod —
      # which the Dockerfile's `go mod download` (never `tidy`) also depends on.
      - name: Dependencies are tidy and recorded
        run: |
          go mod tidy -diff
          go mod verify

      - name: Vet
        run: go vet ./...

      # Every package, including cmd/labview — so §2.5's one-shot subcommands are
      # compiled by the gate and not only by the image build.
      - name: Build
        run: go build ./...

      # No Docker daemon and no network: the corpus forces configuration to defaults
      # and strips every LABVIEW_* credential from the environment itself (§23), so
      # this is hermetic by construction rather than by convention here.
      - name: Corpus and unit tests
        run: go test ./...

      # The race detector is a separate step so a data race is distinguishable from a
      # failed assertion at a glance. The server's bounded concurrency (§5) is the
      # reason it is worth the second run.
      - name: Tests under the race detector
        run: go test -race ./...

      # §2.2's bundle is hand-authored and committed, and `go:embed` embeds whatever
      # bytes are on disk — so nothing above this line has ever read it. The Go tests
      # that mention internal/webui/dist/assets/app.js assert the *path* is behind the
      # auth gate, which a file of pure gibberish also satisfies. That is how a commit
      # whose app.js contained a syntax error and no DOM code at all went green through
      # every check in this workflow and shipped a page stuck on "Reading the payload…".
      #
      # Pinned rather than the runner's preinstalled Node, for the same reason Go is
      # pinned above: the version doing the checking should be a decision, not a
      # property of the image. Nothing is installed — the checker uses only node:
      # builtins, so §2.1's dependency cap is untouched and there is no lockfile.
      - name: Set up Node (for the browser-bundle checks only)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Parse first, and separately: a bundle that does not parse fails here with the
      # offending line and column, which is a better report than the render checks'
      # several hundred simultaneous failures. Both files, because contract.js is the
      # tables app.js evaluates — an unparseable contract breaks the page just as
      # completely, and it is generated (`go test ./internal/webui -run TestContractAsset
      # -update`), so nobody reads it by eye.
      - name: Browser bundle parses
        run: |
          node --check internal/webui/dist/assets/contract.js
          node --check internal/webui/dist/assets/app.js

      # And then that it actually renders. The payload is the edge fixture's, scanned
      # here rather than committed: a stored payload would drift from the scanner
      # silently, and this way the checks read whatever the pipeline currently emits.
      #
      # Every transport that would leave the process is switched off, which is what makes
      # the scan hermetic — and this runner is the reason it has to be explicit. Unset
      # LABVIEW_DOCKER_HOST means the conventional local socket (see labview/Dockerfile),
      # and ubuntu-latest has a live Engine on it, so a plain `scan` here would enumerate
      # the *runner's* containers: the payload would then depend on what else the job had
      # started, and foreign container names would end up in the checks. The identity and
      # proxy reads are off for the same reason inverted — nothing in this fixture resolves,
      # so they can only add a connection failure whose text varies with the runner's DNS.
      # The probe is already off by default (§14); naming it means a change to that default
      # cannot quietly turn this step into outbound HTTP to fixture hostnames.
      #
      # `LABVIEW_APPS_ROOT` is scoped to the one command. No fixture path reaches an image
      # layer (I2) — this job builds no image.
      - name: Browser bundle renders
        env:
          LABVIEW_APPS_ROOT: fixtures/edge
          LABVIEW_DOCKER_ENABLED: 'false'
          LABVIEW_AUTHENTIK_ENABLED: 'false'
          LABVIEW_TRAEFIK_ENABLED: 'false'
          LABVIEW_PROBE_ENABLED: 'false'
        run: |
          go run ./cmd/labview scan > "$RUNNER_TEMP/payload.json"
          node ../.github/scripts/render-smoke.mjs "$RUNNER_TEMP/payload.json"

  # §2.1 says "Go 1.23 or later", and go.mod's `go 1.23.0` is that claim written down.
  # This job is the check that it is still true, and it is the *only* place the floor is
  # built on — the image, the corpus and the vulnerability scan all use a supported
  # toolchain instead (see labview/Dockerfile for why those two things must not be the
  # same knob). A `go get` that quietly raises the directive, or a 1.24+ API landing in
  # a source file, fails here and nowhere else.
  #
  # Compile and vet only, not the corpus: what is under test is whether the declared
  # minimum can still build this module, and behaviour is covered by `test` above on the
  # toolchain that actually ships. go-version-file rather than a literal so the floor
  # keeps being declared in exactly one place, which is what makes a silent bump visible.
  floor-compat:
    name: Builds on the declared floor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labview
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go (go.mod's declared minimum)
        uses: actions/setup-go@v7
        with:
          go-version-file: labview/go.mod
          cache-dependency-path: labview/go.sum

      - name: Build and vet on the floor
        run: |
          go version
          go build ./...
          go vet ./...

  build-and-push:
    name: Image
    needs: [test, floor-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Only when something actually ships. Pull requests build the image below but
      # never log in: fork PRs receive no secrets, so a login on that path fails for
      # a reason that has nothing to do with the change, and a same-repo PR would
      # otherwise publish :latest from an unmerged branch.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # All application code lives in labview/, so the build context is scoped
          # there. The Dockerfile COPYs go.mod, go.sum, cmd/ and internal/ as
          # context-relative paths, so a repo-root context finds neither the
          # Dockerfile nor those directories. There is no frontend stage: §2.2's
          # bundle is committed under internal/webui/dist and embedded by `go:embed`,
          # so `go build` is the whole build.
          context: ./labview
          # A pull request builds the image — proving the Dockerfile still works is
          # part of reviewing the change — and pushes nothing.
          push: ${{ github.event_name == 'push' }}
          no-cache: true
          # The commit the image is built from, so the running UI can name it. The full
          # sha goes in and LabView shortens it, which makes the stamp in the topbar the
          # first seven characters of the :${{ github.sha }} tag below — one commit, named
          # the same way in both places.
          build-args: |
            LABVIEW_BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/labview:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/labview:${{ github.sha }}
