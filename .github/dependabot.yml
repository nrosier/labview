# Dependabot keeps LabView's Go modules, its Docker base images, and the GitHub
# Actions used by these workflows up to date. Minor/patch bumps are grouped to cut
# PR noise; major bumps come as individual PRs. Merging is manual in every case —
# there is no auto-merge workflow in this repository.
version: 2
updates:
  # --- LabView Go modules --------------------------------------------------
  # §2.1 caps the runtime dependency surface at a YAML 1.2 parser, a bcrypt
  # implementation and JWT/JWKS verification, so this is a very short list and a PR
  # here deserves reading rather than waving through.
  #
  # Read the go.mod comment before merging one. §2.1's floor moves whenever a direct
  # dependency's own `go` directive forces it — golang.org/x/crypto v0.52.0 raised it
  # from 1.23.0 to 1.27.0 this way. Check that go.mod's header comment and
  # IMPLEMENTATION.md §2.1 still agree after any bump; Dependabot only sees the
  # module version, not the spec.
  - package-ecosystem: gomod
    directory: /labview
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    groups:
      # One PR for all non-major updates.
      gomod-minor-patch:
        update-types:
          - minor
          - patch

  # --- Dockerfile base images ----------------------------------------------
  # Two: golang:1.27-alpine for the build stage and distroless/static-debian12 for
  # the runtime stage.
  #
  # The build stage tracks a *supported* toolchain, deliberately not §2.1's floor —
  # see labview/Dockerfile for why: building on the floor was tried and reverted,
  # since Go 1.23 going end of life left 28 reachable stdlib advisories with no
  # patched 1.23 to move to. So major and minor Go bumps are ignored here on
  # purpose — the maintainer picks when to move the image rather than Dependabot
  # proposing whatever tag is newest on its own schedule. Patch updates to that
  # tag, and every update to the distroless runtime base (where the CA bundle
  # that §2.4 depends on lives), come through normally.
  - package-ecosystem: docker
    directory: /labview
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # --- The GitHub Actions used by these workflows --------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        update-types:
          - minor
          - patch
