services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./config:/config
      - /mnt/media:/media:ro
    ports:
      - "8096:8096"
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.example.com`)"
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: "cloudflare"
      traefik.http.routers.jellyfin.middlewares: "authentik@docker"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      dockflare.enable: "true"
      dockflare.hostname: "jellyfin.example.com"
      dockflare.service: "http://jellyfin:8096"
      dockflare.access.policy: "authenticate"
      dockflare.access.group: "media-users"

networks:
  proxy:
    external: true
