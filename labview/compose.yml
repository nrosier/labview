# Deploy LabView on TrueNAS Scale (Apps -> Custom App -> "Install via YAML",
# or drop this in /mnt/apps/labview/compose.yml and run `docker compose up -d`).
#
# Live Docker state is read through the shared docker-socket-proxy (tcp://dockerproxy:2375)
# — LabView never touches the raw socket. Your app stacks are mounted read-only.
#
# Prerequisites (already present in this homelab): the external `proxy` and
# `dockerproxy` networks, and the `dockerproxy` (tecnativa/docker-socket-proxy)
# stack. LabView only needs read endpoints (CONTAINERS/NETWORKS/VOLUMES/IMAGES/INFO/PING).
services:
  labview:
    build: .
    # Or use a prebuilt image once you publish one:
    # image: docker.io/YOUR_DOCKERHUB_USERNAME/labview:latest  # published by .github/workflows/docker-image.yml
    container_name: labview
    restart: unless-stopped
    environment:
      LABVIEW_APPS_ROOT: /data/apps
      # Talk to the Docker API via the socket proxy instead of mounting the socket.
      LABVIEW_DOCKER_HOST: tcp://dockerproxy:2375
      LABVIEW_PORT: "8080"
      # LABVIEW_CONFIG: /config/config.yml   # optional: mount a tuned config
    volumes:
      # Your per-container stacks, read-only.
      - /mnt/apps:/data/apps:ro
      # Optional tuned config:
      # - /mnt/apps/labview/config.yml:/config/config.yml:ro
    ports:
      # 8080 is very common on a homelab; publish LabView on an uncommon port.
      # (Not needed at all if you only reach it through Traefik below.)
      - "8459:8080"
    networks:
      - default
      - proxy         # reach it through Traefik / expose via DockFlare
      - dockerproxy   # reach the docker-socket-proxy for live state

    # --- Example: put LabView behind YOUR stack (Traefik + Authentik) ---
    # Uncomment and adapt to expose it locally with SSO, matching your other apps.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy"
    #   - "traefik.http.routers.labview.rule=Host(`labview.bunbun.be`)"
    #   - "traefik.http.routers.labview.entrypoints=websecure"
    #   - "traefik.http.routers.labview.tls.certresolver=cloudflare"
    #   - "traefik.http.routers.labview.middlewares=authentik@docker"
    #   - "traefik.http.services.labview.loadbalancer.server.port=8080"
    #   # And/or publish it through the Cloudflare tunnel via DockFlare:
    #   - "dockflare.enable=true"
    #   - "dockflare.hostname=labview.bunbun.be"
    #   - "dockflare.service=http://labview:8080"

networks:
  proxy:
    external: true
  dockerproxy:
    external: true
