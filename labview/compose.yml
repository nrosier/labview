# Deploy LabView next to the stacks it inspects (on TrueNAS Scale: Apps -> Custom
# App -> "Install via YAML", or drop this in <apps-root>/labview/compose.yml and
# run `docker compose up -d`).
#
# Every name below is an example, not a requirement — network names, the socket
# proxy's hostname and the apps root all come from your setup, and LabView reads
# whatever you point it at. The only fixed parts are the LABVIEW_* variables.
#
# Live Docker state is read through a docker-socket-proxy over TCP so LabView
# never touches the raw socket, and needs only its read endpoints
# (CONTAINERS/NETWORKS/VOLUMES/IMAGES/INFO/PING). Your app stacks are mounted
# read-only.
#
# Credentials — the Authentik token, the Traefik password, the session key and the
# OIDC client secret — come from the environment, and only from there. Keep the
# values in a `.env` file beside this one (git ignores it) and reference them as
# `${NAME:-}` below, so the compose file you commit names each credential without
# holding it:
#
#   LABVIEW_AUTHENTIK_TOKEN=ak-...
#   LABVIEW_SESSION_SECRET=...
#
# `:-` and not `:?` on purpose: a name with no matching `.env` entry arrives empty,
# LabView reports it as a credential that carries nothing, and the rest of the scan
# still runs. A typo in a secret's name should not stop the container from starting.
services:
  labview:
    image: niqck/labview:latest
    container_name: labview
    restart: unless-stopped
    environment:
      LABVIEW_APPS_ROOT: /data/apps
      # Docker API endpoint. This example points at a socket-proxy container named
      # `dockerproxy`; use whatever yours is called. Omit the variable entirely to
      # use /var/run/docker.sock (then mount it read-only), or unset
      # LABVIEW_DOCKER_ENABLED=false to run config-only.
      LABVIEW_DOCKER_HOST: tcp://dockerproxy:2375
      LABVIEW_PORT: "8080"
      LABVIEW_CONFIG: /config/config.yml
      #
      # Per-request timeout for the Docker endpoint, in ms (default 5000). Raise it
      # only for a genuinely slow host: it is socket inactivity, not total time, so
      # a large fleet's listing is unaffected. Its job is to turn an endpoint that
      # accepts the connection and then says nothing into a reported `timeout`
      # rather than a scan that never finishes.
      # LABVIEW_DOCKER_TIMEOUT: "5000"
      #
      # --- Optional: read the Authentik API for confirmed auth posture ---
      # Without a token, protection is inferred from compose labels and env vars.
      # With one, LabView reads applications/providers/outposts and reports what
      # Authentik itself says — including the case labels cannot show you: an
      # application whose provider no outpost is serving, which protects nothing.
      #
      # Use a read-only service account (view_application / view_provider /
      # view_outpost, no groups), and keep the value in `.env`:
      # LABVIEW_AUTHENTIK_TOKEN: ${LABVIEW_AUTHENTIK_TOKEN:-}
      #
      # The host is discovered from the scanned stacks when Authentik runs among
      # them, preferring its container address so the call stays on the container
      # network. Set this only if it lives elsewhere or discovery guesses wrong:
      # LABVIEW_AUTHENTIK_URL: http://authentik-server:9000
      #
      # --- Optional: read the reverse proxy's API to verify the labels ---
      # On by default and needs no configuration: the proxy is located among the
      # scanned stacks (a router of its own targeting `api@internal`, the hop a
      # tunnel origin resolved to, or the Traefik image) and its container address
      # is probed. If nothing answers, the scan continues from the labels alone.
      #
      # For it to answer, Traefik needs `api: {}` plus an entrypoint on the
      # container network that is NOT published to the host — see the `traefik`
      # block in config.example.yml. Then no credential is involved at all.
      #
      # Set the URL only when the proxy is not among the scanned stacks, or when
      # discovery guesses wrong:
      # LABVIEW_TRAEFIK_URL: http://traefik:8080
      #
      # Only needed if the API is reachable solely through a hostname Authentik
      # gates: an Authentik user plus an **app password** — an API token will not
      # work, see config.example.yml.
      # LABVIEW_TRAEFIK_USERNAME: labview
      # LABVIEW_TRAEFIK_PASSWORD: ${LABVIEW_TRAEFIK_PASSWORD:-}
      #
      # --- Optional: LabView's own login ---
      # Nothing here is required. LabView asks for a sign-in only once a method is
      # usable: a `./config/passwd` holding at least one `user:hash` line, or an
      # OIDC issuer plus client id. Until then the HTTP surface is open exactly as
      # it was before, and the startup log says so in one line.
      #
      # Make a line with `docker exec labview node dist/hashpw.js alice` (or
      # `htpasswd -nbB alice <password>`) and append it to ./config/passwd.
      #
      # Set a session key, or every restart signs everyone out:
      # LABVIEW_SESSION_SECRET: ${LABVIEW_SESSION_SECRET:-}
      #
      # Turn the password form off if you would rather rely only on OIDC or on
      # your edge:
      # LABVIEW_AUTH_PASSWD_ENABLED: "false"
      #
      # OIDC — see "Access control" in README.md for the Authentik walkthrough.
      # The redirect URI you register there is
      # https://labview.example.com/auth/oidc/callback
      # The client id and the secret are two halves of one credential and are set
      # the same way; leave the secret out entirely for a public client using PKCE.
      # LABVIEW_OIDC_ISSUER: https://authentik.example.com/application/o/labview/
      # LABVIEW_OIDC_CLIENT_ID: <client id>
      # LABVIEW_OIDC_CLIENT_SECRET: ${LABVIEW_OIDC_CLIENT_SECRET:-}
    volumes:
      # LabView's own config and users, read-only, from ./config next to this file.
      #
      # Both host files must exist before `up`: Docker creates a **directory** at a
      # bind source it cannot find, and a directory here means a config that silently
      # falls back to defaults and a passwd file LabView warns about. `touch
      # ./config/passwd` is enough — an empty file simply means no password login.
      #
      # A single-file bind also does not follow an inode replacement, and most editors
      # replace rather than rewrite: edit these in place (`>>` appends fine), or mount
      # `./config:/config:ro` as a directory if your editor insists.
      - ./config/config.yml:/config/config.yml:ro
      - ./config/passwd:/config/passwd:ro
      # Your per-container stacks, read-only.
      - /mnt/apps:/data/apps:ro
    # No `ports:` on purpose. A published host port answers directly at
    # <host-ip>:<port>, bypassing the reverse proxy and therefore bypassing any
    # SSO middleware on it. LabView's own login covers that gap when you have
    # configured one — but an unconfigured LabView is open, so for a dashboard
    # that lists your whole topology this stays the default. Reach it through the
    # proxy instead.
    # Uncomment only if you need direct access while setting it up, or if you are
    # relying on the login above:
    # ports:
    #   - "8459:8080"   # 8080 is very common on a homelab; publish somewhere quiet
    networks:
      - default
      - proxy         # reach it through the reverse proxy / publish via DockFlare
                      # (also how the Authentik API is reached by container name,
                      #  if you enable that and Authentik is on this network)
      - dockerproxy   # reach the docker-socket-proxy for live state

    # --- Example: put LabView behind your own edge (Traefik + Authentik) ---
    # Uncomment and adapt to the label set your other apps already use, so
    # LabView is reached and protected exactly like the rest of the fleet.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy"
    #   - "traefik.http.routers.labview.rule=Host(`labview.example.com`)"
    #   - "traefik.http.routers.labview.entrypoints=websecure"
    #   - "traefik.http.routers.labview.tls.certresolver=cloudflare"
    #   - "traefik.http.routers.labview.priority=100"
    #   - "traefik.http.routers.labview.middlewares=authentik@docker"
    #   - "traefik.http.services.labview.loadbalancer.passhostheader=true"
    #   - "traefik.http.services.labview.loadbalancer.server.port=8080"
    #   # And/or publish it through the Cloudflare tunnel via DockFlare.
    #   # Point the tunnel origin at your reverse proxy, not at this container, so
    #   # the request still passes through the auth middleware — sending it
    #   # straight to http://labview:8080 would put the dashboard on the internet
    #   # with no SSO at all.
    #   - "dockflare.enable=true"
    #   - "dockflare.hostname=labview.example.com"
    #   - "dockflare.service=https://<reverse-proxy-host>"
    #   - "dockflare.http2_origin=true"
    #   - "dockflare.match_sni_to_host=true"

networks:
  proxy:
    external: true
  dockerproxy:
    external: true
