# LabView configuration.
# Copy to config.yml (or point LABVIEW_CONFIG at it) and tune to match your setup.
# Every value here can also be overridden by an environment variable (see README).

# Where your per-container stacks live. Each immediate subdirectory that contains
# a compose file is treated as one "app stack".
#   /mnt/apps/<container>/compose.yml  (+ optional .env)
appsRoot: /data/apps

# Compose file names to look for inside each stack directory, in priority order.
composeFilenames:
  - compose.yml
  - compose.yaml
  - docker-compose.yml
  - docker-compose.yaml

# Optional sidecar file beside the compose file, where you declare what a scan
# cannot observe: what the service is, that it authenticates internally, that it is
# intentionally left open. See .labview.example for every field.
#
# Probed in this order; the first that exists wins, so two sidecars in one directory
# can never half-apply. Nothing in a sidecar changes what LabView detected.
sidecarFilenames:
  - .labview
  - .labview.yml
  - .labview.yaml

# Enrich compose config with live data from the Docker Engine when it is
# reachable. Safe to leave on: if Docker is unreachable the scan degrades to
# config-only automatically.
docker:
  enabled: true
  # Endpoint. Empty host = use socketPath below (the default: no assumption about
  # your hostnames). Set host to reach the Engine over TCP instead — typically a
  # docker-socket-proxy, whatever you named that container:
  #   host: dockerproxy
  # The standard DOCKER_HOST variable is honoured too, as is LABVIEW_DOCKER_HOST,
  # and either takes precedence over this file.
  host: ""
  port: 2375
  socketPath: /var/run/docker.sock
  # Max concurrent `container inspect` calls per scan. Raise for large fleets,
  # lower if the socket proxy starts rate-limiting or dropping connections.
  maxConcurrency: 8
  # Per-request socket-inactivity timeout, in milliseconds — reset whenever bytes
  # arrive, so a large fleet's container listing is unaffected. It exists for the
  # endpoint that accepts the connection and then says nothing: without it a scan
  # waits forever, and with it the startup log reports `timeout` in five seconds.
  timeoutMs: 5000

# Secret handling. Values of env keys matching these patterns are masked in the
# API and UI (keys are always shown, values replaced with a placeholder).
secrets:
  maskValues: true
  # Case-insensitive substrings. A key matching any of these is masked.
  keyPatterns:
    - PASS
    - SECRET
    - TOKEN
    - KEY
    - APIKEY
    - CREDENTIAL
    - PRIVATE
    - SALT
    - PEPPER
    - DSN
  # Extra explicit keys to always mask.
  keysAlways: []
  # Keys to never mask even if they match a pattern (e.g. PUBLIC_KEY_URL).
  keysNever:
    - PUBLIC_KEY_URL
    - KEYCLOAK_REALM
  # Independently of the key name, strip the password out of any value shaped like
  # "scheme://user:password@host". This is what catches connection strings such as
  # DATABASE_URL / REDIS_URL / AMQP_URL, whose keys match none of the patterns
  # above. Scheme, user and host stay visible; only the password is replaced.
  redactUriCredentials: true

# Label matching. These are tolerant of both list ("- k=v") and map (k: v) syntax.
labels:
  dockflare:
    prefix: dockflare
  traefik:
    prefix: traefik
  authentik:
    # Markers that identify Authentik. Matched at token boundaries against a
    # forwardauth address, an OIDC issuer or an LDAP host — so "authentik" matches
    # "http://authentik-server:9000/..." but does NOT match "oauth.example.com".
    #
    # Your own Authentik hostnames do not belong here: they are discovered at scan
    # time from whichever stack runs Authentik, together with its Traefik and
    # DockFlare hostnames. Add an entry only if your Authentik lives outside
    # appsRoot and so cannot be discovered. Avoid host-naming conventions
    # ("auth.", "sso.") — they attribute other people's providers to Authentik.
    hostHints:
      - authentik
      - goauthentik.io
    # Env key substrings that indicate LDAP-based auth wired to Authentik.
    ldapEnvHints:
      - LDAP_HOST
      - LDAP_URI
      - LDAP_SERVER
      - LDAP_URL
    # Env key substrings that indicate OAuth/OIDC-based auth.
    oauthEnvHints:
      - OIDC
      - OAUTH
      - OPENID
      - ISSUER
      - CLIENT_ID
      - CLIENT_SECRET
      - SSO

# Read the Authentik API to confirm which services are actually protected.
#
# Without this, protection is inferred from compose labels and env vars: a
# forward-auth middleware address, an OIDC issuer, an LDAP host. That finds gates
# wired up in compose, but it cannot see a gate configured only in Authentik, and
# it cannot tell an application that *has* a provider from one whose provider no
# outpost is serving — which enforces nothing at all.
#
# With a token, LabView reads applications, providers and outposts, matches each
# application to a service, and reports the provider's own account of the gate as
# `confirmed`. Entirely optional: with no token nothing is requested, and a
# credential is never sent to an endpoint that has not first been confirmed to be
# an Authentik API.
#
# The token needs read access only. Create a service account with no groups, give
# it view_application / view_provider / view_outpost, and nothing else — LabView
# only ever issues GETs, and a token with more rights than that is a token an
# attacker reaching this container would inherit.
#
# One consequence of that is worth knowing, because it is Authentik's behaviour and
# not a limit LabView chose: /core/applications/ filters its own answer through the
# policy engine as the token's user, so a least-privilege token is served only the
# applications that user may launch. LabView reads the total Authentik reports
# alongside the subset it was given, rebuilds the withheld ones from the providers
# assigned to them (provider endpoints are not policy-filtered), and states in the
# banner how many were neither returned nor rebuildable. Making the service account
# a superuser makes it hand over the exact list instead — strictly optional, and a
# trade of least privilege for completeness that is yours to make.
authentik:
  enabled: true
  # Base URL including scheme and port, e.g. http://authentik-server:9000. Leave
  # empty to discover it: whichever scanned stack runs Authentik is located from
  # its image, and its container address is tried before any public hostname, so
  # the API call stays on the container network. Set this only when your Authentik
  # lives outside appsRoot, or when discovery picks the wrong endpoint.
  url: ""
  # The API token. Prefer tokenFile — a value here ends up in the config file, and
  # a value in LABVIEW_AUTHENTIK_TOKEN ends up in `docker inspect` output.
  token: ""
  # Path to a file holding the token, e.g. a docker secret or a mounted file.
  # Takes precedence over `token`.
  tokenFile: ""
  # Per-request timeout in milliseconds. The whole exchange is a handful of GETs;
  # if it times out the scan continues without the API and says so.
  timeoutMs: 5000
  # Hard cap on pages fetched per list endpoint, so a very large instance cannot
  # stall a scan. 20 pages x 100 records is 2000 applications.
  maxPages: 20
  #
  # If your Authentik serves HTTPS with a private CA, add the CA to Node's trust
  # store rather than disabling verification — LabView has no flag to skip it,
  # because a bearer token sent to an unverified endpoint is a token given away:
  #   NODE_EXTRA_CA_CERTS=/etc/ssl/certs/internal-ca.pem
  # Reaching the API over the container network as plain HTTP avoids the question
  # entirely, and is what discovery prefers.

# Read the reverse proxy's own runtime configuration to verify the labels against
# what it is actually serving.
#
# Compose labels state what the operator asked for. Only Traefik knows what it
# built from them, and three differences matter:
#
#   * a router the labels declare that the proxy is not serving at all — a typo in
#     a rule, a missing entrypoint, a container it never picked up;
#   * a middleware named in a label that is not in the chain the proxy built, so
#     the service reads "protected" here and answers without a login;
#   * a middleware defined in a Traefik *file* provider, which a compose scan
#     cannot see, and which is therefore only ever reported as `inferred`.
#
# Reading /api/rawdata and /api/entrypoints replaces all three with the proxy's own
# account, at `confirmed` confidence. It also reports backend health, and lists the
# routers no scanned service could be identified for.
#
# Enabling the API safely: give it its own entrypoint on the container network and
# do NOT publish that port.
#
#   # traefik static config
#   api: {}                       # not `api.insecure` on a published port
#   entryPoints:
#     traefik:
#       address: ":8080"          # reachable only from the docker network
#
# Then nothing needs a credential and LabView sends none. If you instead front the
# dashboard with a router and gate it with Authentik, see username/password below.
traefik:
  enabled: true
  # Base URL including scheme and port, e.g. http://traefik:8080. Leave empty to
  # discover it: a scanned service is taken to be the proxy when one of its own
  # routers targets `api@internal`, when another service's tunnel origin resolved
  # to it, or (last resort) when it runs the Traefik image. Container addresses are
  # tried before any public hostname, so the call stays on the container network.
  url: ""
  #
  # Credential for a gated API. Leave both empty unless the API is only reachable
  # through a hostname that Authentik protects — an endpoint that answers
  # unauthenticated is used with no credential at all, and a credential is only
  # ever sent to an endpoint you configured by hand or to a hostname this scan
  # proved belongs to the service whose own labels declare `api@internal`.
  #
  # An Authentik *API token* is not a valid credential here. A proxy provider
  # accepts HTTP Basic with an Authentik user plus an **app password** — the
  # credentials are used internally with the OAuth2 machine-to-machine flow, which
  # an API token cannot drive — or the reserved username `goauthentik.io/token`
  # with a token as the password. Either way the provider needs "Intercept header
  # authentication" enabled, or it will answer the request itself instead of
  # passing it through.
  username: ""
  # Prefer passwordFile. A value here ends up in the config file, and a value in
  # LABVIEW_TRAEFIK_PASSWORD ends up in `docker inspect` output.
  password: ""
  # Path to a file holding the password (docker secret, mounted file). Takes
  # precedence over `password`.
  passwordFile: ""
  # Per-request timeout in milliseconds. The whole exchange is three GETs; if it
  # times out the scan continues from the labels alone and says so.
  timeoutMs: 5000

# Rescan cache: how long (seconds) a scan result is served before a fresh scan is
# triggered on the next request. The UI also has a manual "Rescan" button.
cacheTtlSeconds: 60

# HTTP server.
server:
  host: 0.0.0.0
  port: 8080
