# LabView configuration.
# Copy to config.yml (or point LABVIEW_CONFIG at it) and tune to match your setup.
# Every value here can also be overridden by an environment variable (see README).

# Where your per-container stacks live. Each immediate subdirectory that contains
# a compose file is treated as one "app stack".
#   /mnt/apps/<container>/compose.yml  (+ optional .env)
appsRoot: /data/apps

# Compose file names to look for inside each stack directory, in priority order.
composeFilenames:
  - compose.yml
  - compose.yaml
  - docker-compose.yml
  - docker-compose.yaml

# Enrich compose config with live data from the Docker Engine when it is
# reachable. Safe to leave on: if Docker is unreachable the scan degrades to
# config-only automatically.
docker:
  enabled: true
  # Endpoint. Empty host = use socketPath below (the default: no assumption about
  # your hostnames). Set host to reach the Engine over TCP instead — typically a
  # docker-socket-proxy, whatever you named that container:
  #   host: dockerproxy
  # The standard DOCKER_HOST variable is honoured too, as is LABVIEW_DOCKER_HOST,
  # and either takes precedence over this file.
  host: ""
  port: 2375
  socketPath: /var/run/docker.sock
  # Max concurrent `container inspect` calls per scan. Raise for large fleets,
  # lower if the socket proxy starts rate-limiting or dropping connections.
  maxConcurrency: 8

# Secret handling. Values of env keys matching these patterns are masked in the
# API and UI (keys are always shown, values replaced with a placeholder).
secrets:
  maskValues: true
  # Case-insensitive substrings. A key matching any of these is masked.
  keyPatterns:
    - PASS
    - SECRET
    - TOKEN
    - KEY
    - APIKEY
    - CREDENTIAL
    - PRIVATE
    - SALT
    - PEPPER
    - DSN
  # Extra explicit keys to always mask.
  keysAlways: []
  # Keys to never mask even if they match a pattern (e.g. PUBLIC_KEY_URL).
  keysNever:
    - PUBLIC_KEY_URL
    - KEYCLOAK_REALM
  # Independently of the key name, strip the password out of any value shaped like
  # "scheme://user:password@host". This is what catches connection strings such as
  # DATABASE_URL / REDIS_URL / AMQP_URL, whose keys match none of the patterns
  # above. Scheme, user and host stay visible; only the password is replaced.
  redactUriCredentials: true

# Label matching. These are tolerant of both list ("- k=v") and map (k: v) syntax.
labels:
  dockflare:
    prefix: dockflare
  traefik:
    prefix: traefik
  authentik:
    # Markers that identify Authentik. Matched at token boundaries against a
    # forwardauth address, an OIDC issuer or an LDAP host — so "authentik" matches
    # "http://authentik-server:9000/..." but does NOT match "oauth.example.com".
    #
    # Your own Authentik hostnames do not belong here: they are discovered at scan
    # time from whichever stack runs Authentik, together with its Traefik and
    # DockFlare hostnames. Add an entry only if your Authentik lives outside
    # appsRoot and so cannot be discovered. Avoid host-naming conventions
    # ("auth.", "sso.") — they attribute other people's providers to Authentik.
    hostHints:
      - authentik
      - goauthentik.io
    # Env key substrings that indicate LDAP-based auth wired to Authentik.
    ldapEnvHints:
      - LDAP_HOST
      - LDAP_URI
      - LDAP_SERVER
      - LDAP_URL
    # Env key substrings that indicate OAuth/OIDC-based auth.
    oauthEnvHints:
      - OIDC
      - OAUTH
      - OPENID
      - ISSUER
      - CLIENT_ID
      - CLIENT_SECRET
      - SSO

# Rescan cache: how long (seconds) a scan result is served before a fresh scan is
# triggered on the next request. The UI also has a manual "Rescan" button.
cacheTtlSeconds: 60

# HTTP server.
server:
  host: 0.0.0.0
  port: 8080
