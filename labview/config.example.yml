# LabView configuration.
# Copy to config.yml (or point LABVIEW_CONFIG at it) and tune to match your setup.
# Every value here can also be overridden by an environment variable (see README).

# Where your per-container stacks live. Each immediate subdirectory that contains
# a compose file is treated as one "app stack".
#   /mnt/apps/<container>/compose.yml  (+ optional .env)
appsRoot: /data/apps

# Compose file names to look for inside each stack directory, in priority order.
composeFilenames:
  - compose.yml
  - compose.yaml
  - docker-compose.yml
  - docker-compose.yaml

# Optional sidecar file beside the compose file, where you declare what a scan
# cannot observe: what the service is, that it authenticates internally, that it is
# intentionally left open. See .labview.example for every field.
#
# Probed in this order; the first that exists wins, so two sidecars in one directory
# can never half-apply. Nothing in a sidecar changes what LabView detected.
sidecarFilenames:
  - .labview
  - .labview.yml
  - .labview.yaml

# Enrich compose config with live data from the Docker Engine when it is
# reachable. Safe to leave on: if Docker is unreachable the scan degrades to
# config-only automatically.
docker:
  enabled: true
  # Endpoint. Empty host = use socketPath below (the default: no assumption about
  # your hostnames). Set host to reach the Engine over TCP instead — typically a
  # docker-socket-proxy, whatever you named that container:
  #   host: dockerproxy
  # The standard DOCKER_HOST variable is honoured too, as is LABVIEW_DOCKER_HOST,
  # and either takes precedence over this file.
  host: ""
  port: 2375
  socketPath: /var/run/docker.sock
  # Max concurrent `container inspect` calls per scan. Raise for large fleets,
  # lower if the socket proxy starts rate-limiting or dropping connections.
  maxConcurrency: 8
  # Per-request socket-inactivity timeout, in milliseconds — reset whenever bytes
  # arrive, so a large fleet's container listing is unaffected. It exists for the
  # endpoint that accepts the connection and then says nothing: without it a scan
  # waits forever, and with it the startup log reports `timeout` in five seconds.
  timeoutMs: 5000

# Secret handling. Values of env keys matching these patterns are masked in the
# API and UI (keys are always shown, values replaced with a placeholder).
secrets:
  maskValues: true
  # Case-insensitive substrings. A key matching any of these is masked.
  keyPatterns:
    - PASS
    - SECRET
    - TOKEN
    - KEY
    - APIKEY
    - CREDENTIAL
    - PRIVATE
    - SALT
    - PEPPER
    - DSN
  # Extra explicit keys to always mask.
  keysAlways: []
  # Keys to never mask even if they match a pattern (e.g. PUBLIC_KEY_URL).
  keysNever:
    - PUBLIC_KEY_URL
    - KEYCLOAK_REALM
  # Independently of the key name, strip the password out of any value shaped like
  # "scheme://user:password@host". This is what catches connection strings such as
  # DATABASE_URL / REDIS_URL / AMQP_URL, whose keys match none of the patterns
  # above. Scheme, user and host stay visible; only the password is replaced.
  redactUriCredentials: true

# Label matching. These are tolerant of both list ("- k=v") and map (k: v) syntax.
labels:
  dockflare:
    prefix: dockflare
  traefik:
    prefix: traefik
  authentik:
    # Markers that identify Authentik. Matched at token boundaries against a
    # forwardauth address, an OIDC issuer or an LDAP host — so "authentik" matches
    # "http://authentik-server:9000/..." but does NOT match "oauth.example.com".
    #
    # Your own Authentik hostnames do not belong here: they are discovered at scan
    # time from whichever stack runs Authentik, together with its Traefik and
    # DockFlare hostnames. Add an entry only if your Authentik lives outside
    # appsRoot and so cannot be discovered. Avoid host-naming conventions
    # ("auth.", "sso.") — they attribute other people's providers to Authentik.
    hostHints:
      - authentik
      - goauthentik.io
    # Env key substrings that indicate LDAP-based auth wired to Authentik.
    ldapEnvHints:
      - LDAP_HOST
      - LDAP_URI
      - LDAP_SERVER
      - LDAP_URL
    # Env key substrings that indicate OAuth/OIDC-based auth.
    oauthEnvHints:
      - OIDC
      - OAUTH
      - OPENID
      - ISSUER
      - CLIENT_ID
      - CLIENT_SECRET
      - SSO

# Read the Authentik API to confirm which services are actually protected.
#
# Without this, protection is inferred from compose labels and env vars: a
# forward-auth middleware address, an OIDC issuer, an LDAP host. That finds gates
# wired up in compose, but it cannot see a gate configured only in Authentik, and
# it cannot tell an application that *has* a provider from one whose provider no
# outpost is serving — which enforces nothing at all.
#
# With a token, LabView reads applications, providers and outposts, matches each
# application to a service, and reports the provider's own account of the gate as
# `confirmed`. Entirely optional: with no token nothing is requested, and a
# credential is never sent to an endpoint that has not first been confirmed to be
# an Authentik API.
#
# The token needs read access only. Create a service account with no groups, give
# it view_application / view_provider / view_outpost, and nothing else — LabView
# only ever issues GETs, and a token with more rights than that is a token an
# attacker reaching this container would inherit.
#
# One consequence of that is worth knowing, because it is Authentik's behaviour and
# not a limit LabView chose: /core/applications/ filters its own answer through the
# policy engine as the token's user, so a least-privilege token is served only the
# applications that user may launch. LabView reads the total Authentik reports
# alongside the subset it was given, rebuilds the withheld ones from the providers
# assigned to them (provider endpoints are not policy-filtered), and states in the
# banner how many were neither returned nor rebuildable. Making the service account
# a superuser makes it hand over the exact list instead — strictly optional, and a
# trade of least privilege for completeness that is yours to make.
authentik:
  enabled: true
  # Base URL including scheme and port, e.g. http://authentik-server:9000. Leave
  # empty to discover it: whichever scanned stack runs Authentik is located from
  # its image, and its container address is tried before any public hostname, so
  # the API call stays on the container network. Set this only when your Authentik
  # lives outside appsRoot, or when discovery picks the wrong endpoint.
  url: ""
  # The API token. Set it in LABVIEW_AUTHENTIK_TOKEN rather than here, and keep the
  # value in a `.env` beside compose.yml — see "Where the credentials go" in
  # README.md. A value written here is read, and the variable overrides it, but this
  # file is the one you are most likely to copy somewhere or commit by accident.
  token: ""
  # Per-request timeout in milliseconds. The whole exchange is a handful of GETs;
  # if it times out the scan continues without the API and says so.
  timeoutMs: 5000
  # Hard cap on pages fetched per list endpoint, so a very large instance cannot
  # stall a scan. 20 pages x 100 records is 2000 applications.
  maxPages: 20
  #
  # If your Authentik serves HTTPS with a private CA, add the CA to Node's trust
  # store rather than disabling verification — LabView has no flag to skip it,
  # because a bearer token sent to an unverified endpoint is a token given away:
  #   NODE_EXTRA_CA_CERTS=/etc/ssl/certs/internal-ca.pem
  # Reaching the API over the container network as plain HTTP avoids the question
  # entirely, and is what discovery prefers.

# Read the reverse proxy's own runtime configuration to verify the labels against
# what it is actually serving.
#
# Compose labels state what the operator asked for. Only Traefik knows what it
# built from them, and three differences matter:
#
#   * a router the labels declare that the proxy is not serving at all — a typo in
#     a rule, a missing entrypoint, a container it never picked up;
#   * a middleware named in a label that is not in the chain the proxy built, so
#     the service reads "protected" here and answers without a login;
#   * a middleware defined in a Traefik *file* provider, which a compose scan
#     cannot see, and which is therefore only ever reported as `inferred`.
#
# Reading /api/rawdata and /api/entrypoints replaces all three with the proxy's own
# account, at `confirmed` confidence. It also reports backend health, and lists the
# routers no scanned service could be identified for.
#
# Enabling the API safely: give it its own entrypoint on the container network and
# do NOT publish that port.
#
#   # traefik static config
#   api: {}                       # not `api.insecure` on a published port
#   entryPoints:
#     traefik:
#       address: ":8080"          # reachable only from the docker network
#
# Then nothing needs a credential and LabView sends none. If you instead front the
# dashboard with a router and gate it with Authentik, see username/password below.
traefik:
  enabled: true
  # Base URL including scheme and port, e.g. http://traefik:8080. Leave empty to
  # discover it: a scanned service is taken to be the proxy when one of its own
  # routers targets `api@internal`, when another service's tunnel origin resolved
  # to it, or (last resort) when it runs the Traefik image. Container addresses are
  # tried before any public hostname, so the call stays on the container network.
  url: ""
  #
  # Credential for a gated API. Leave both empty unless the API is only reachable
  # through a hostname that Authentik protects — an endpoint that answers
  # unauthenticated is used with no credential at all, and a credential is only
  # ever sent to an endpoint you configured by hand or to a hostname this scan
  # proved belongs to the service whose own labels declare `api@internal`.
  #
  # An Authentik *API token* is not a valid credential here. A proxy provider
  # accepts HTTP Basic with an Authentik user plus an **app password** — the
  # credentials are used internally with the OAuth2 machine-to-machine flow, which
  # an API token cannot drive — or the reserved username `goauthentik.io/token`
  # with a token as the password. Either way the provider needs "Intercept header
  # authentication" enabled, or it will answer the request itself instead of
  # passing it through.
  username: ""
  # Set it in LABVIEW_TRAEFIK_PASSWORD, for the reason given at `authentik.token`
  # above.
  password: ""
  # Per-request timeout in milliseconds. The whole exchange is three GETs; if it
  # times out the scan continues from the labels alone and says so.
  timeoutMs: 5000

# ---------------------------------------------------------------------------
# Active probing: ask each HTTP service what it answers.
#
# Everything else in this file reads configuration, or reads an API at an address
# you gave. This one sends a request to your *services*, at the addresses their own
# labels declare — so it is the only stage that puts traffic on your fleet, and
# where a service is fronted by a public hostname that traffic leaves your network
# and reaches it back through Cloudflare's edge. Hence: off by default.
#
# What it buys is the largest class of protection a compose scan cannot see. A
# service with its own login page has no middleware, no env key and no entry in
# anybody's API, so without this the only way to keep it out of the exposed count is
# a `.labview` declaration that nothing can verify. Ask it, and a login page
# answering is evidence. The other half is just as useful: a service that answers
# with its homepage turns an exposure you inferred into one that was measured.
#
# A GET per service, at `/`, with no credential and no redirect followed. Seven
# things count as a login page: 401/407 with a WWW-Authenticate header; a redirect
# off the origin; a redirect to a login path; a `<meta http-equiv="refresh">` that
# goes to either of those; a hidden SAMLRequest/SAMLResponse field (the SAML POST
# binding); an HTML page with a password field; and a form with a username field, a
# submit button and a login-intent marker but no password, which is how magic-link
# and passkey sign-in look. Anything else leaves the finding standing, on purpose: a
# finding you dismiss costs you a look, false comfort costs you the point of the tool.
# So a refresh to `/dashboard` is routing, and a newsletter box posting to a hosted
# list service is not a hand-off.
#
# One shape of answer costs a SECOND request, and it is the only one that does: a 200
# of HTML with no `<form>` anywhere in it. That page is either a login screen drawn in
# the browser or an open dashboard, and its markup cannot tell you which — so four
# current-user addresses (`/api/`, `/api/me`, `/api/v1/me`, `/api/v1/user`) are asked
# in that order, at the origin that already answered, until one of them refuses. A
# refusal that names an authentication scheme in a WWW-Authenticate header is a gate;
# a bare 401 is not, because that is also what an anonymous-enabled Grafana or a
# world-readable Gitea answers. It is reported and left out of the verdict.
#
# The list is the budget. The walk stops at the first refusal, so the usual cost is
# one extra request and the ceiling is four, per service that answered that way. The
# paths are fixed — nothing is taken from the page — and every scan's startup line
# says how many of these it sent, so this can never quietly multiply your traffic.
#
# Only services where HTTP was *observed* are asked — a tunnel route with an
# http/https origin, or a `traefik.http.routers.*` label. A service that only
# publishes a port is never touched, which is what keeps this off your databases.
#
# And only services this scan found *no* authentication for. A Traefik auth
# middleware, an OIDC issuer in the environment, an enforced Authentik provider, a
# Cloudflare Access policy on the route — any one of those and the service is not
# asked, because the answer could not change the verdict. Authentication already
# detected keeps a service out of the exposed count on its own, so probing it would
# only put traffic on somebody's SSO endpoint to confirm what is already known. The
# outcome is reported rather than hidden: the read line and the Login probe tile both
# say how many services were not asked, so a count of 13 in a fleet of 14 HTTP
# services never looks like a service that got lost. There is no key for this — a
# switch to turn it off would send requests that cannot tell you anything.
#
# A `.labview` declaration is not detection, so a service that only *claims*
# authentication is still asked. That is the point of asking.
probe:
  # Or set LABVIEW_PROBE_ENABLED=true.
  #
  # This is the default, not the last word: the switch beside Rescan in the UI turns
  # probing on or off for that one rescan, either way, whatever is set here. The
  # override is not sticky — the next scheduled scan comes back to this value — and
  # the payload says which of the two decided, so the UI can show the switch moving
  # back rather than leave it claiming something untrue.
  #
  # Worth knowing before you leave this off and rely on it: if you have not
  # configured LabView's own login (`auth` above), `POST /api/rescan` is
  # unauthenticated, so anyone who can reach the page can ask for a probing scan.
  # The same visitor can already read the whole inventory, so the thing that closes
  # this is the login, not the switch.
  enabled: false
  # Your host's LAN address, for probing published ports at `<lanHost>:<port>`.
  # LabView runs in a container and can only see the container's interfaces, so it
  # cannot work this out for itself. Empty means published ports are not probed —
  # a fine configuration if everything is behind the tunnel or the proxy anyway.
  # Note this vantage only applies to services already known to speak HTTP; it is
  # not a way to probe a service that has no route.
  lanHost: ""
  # Per-request timeout in milliseconds. A service that does not answer in time is
  # recorded as a timeout, which is its own finding — an address that accepts a
  # connection and never replies is not an exposure.
  timeoutMs: 5000
  # Services asked at once. Kept low because these requests fan out across the whole
  # fleet and many of them land on one reverse proxy; a burst big enough to make it
  # start refusing connections would be recorded as services that did not answer.
  #
  # This is a budget across services, not within one. The current-user walk described
  # above is always sequential, whatever this is set to — four requests fired at once
  # at a single service would spend the fleet's whole allowance inside it, and a
  # parallel walk could not stop at the first refusal, which is what keeps the usual
  # cost at one request instead of four.
  maxConcurrency: 4

# Rescan cache: how long (seconds) a scan result is served before a fresh scan is
# triggered on the next request. The UI also has a manual "Rescan" button.
cacheTtlSeconds: 60

# HTTP server.
server:
  host: 0.0.0.0
  port: 8080

# ---------------------------------------------------------------------------
# LabView's own sign-in.
#
# Open unless configured. `enabled: true` below means *allowed*, not *on*: LabView
# asks for a sign-in only once a method is also usable — a passwd file with at
# least one entry, or an OIDC issuer plus client id. An unconfigured LabView serves
# everything exactly as it did before it had a login, and says so in one startup
# line. That is deliberate: pulling a new image must never lock you out of a
# running deployment.
#
# While enforcing, `/api/*` needs a session. The page itself, its stylesheet and
# its bundle stay public and render the sign-in card — they contain nothing about
# your fleet, by construction.
#
# Nothing here has anything to do with the `basic-auth` you may see reported
# against a scanned service. That describes a service asking *its* visitors for a
# password; this is about who may read LabView.
#
# The whole block is commented out because these are the defaults.
#auth:
#  passwd:
#    # false turns the password form off entirely — for an operator who wants only
#    # OIDC, or only their edge's SSO. The file is then not read at all.
#    enabled: true
#    # `user:hash` per line, `#` comments and blank lines ignored, first entry wins
#    # on a duplicate username. The algorithm is the hash's own `$2a$`/`$2b$`/`$2y$`
#    # prefix — bcrypt, as `htpasswd -nbB` writes it. Make a line with:
#    #   printf 'the password' | docker exec -i labview /labview hashpw alice
#    #   htpasswd -nbB alice '<password>'
#    # Re-read on change, so adding a user needs no restart.
#    file: /config/passwd
#
#  oidc:
#    enabled: true
#    # Authentik: https://authentik.example.com/application/o/<app-slug>/
#    # The discovery document's own `issuer` must equal this exactly.
#    issuer: ""
#    clientId: ""
#    # Set the id and the secret the same way — LABVIEW_OIDC_CLIENT_ID and
#    # LABVIEW_OIDC_CLIENT_SECRET — since the provider issues them together. Leave
#    # the secret out entirely for a public client; PKCE is used either way.
#    clientSecret: ""
#    # Registered with the provider. Leave empty to derive it from the request
#    # (honouring X-Forwarded-Proto/Host), which is right behind a single proxy;
#    # set it when several hostnames reach the same LabView.
#    redirectUri: ""
#    scopes: ["openid", "profile", "email"]
#    # Which claim names the user. Falls back to preferred_username, then email,
#    # then sub — the first that is a usable username wins.
#    usernameClaim: preferred_username
#    # The button's text. Empty means "Sign in with <issuer host>", which tells a
#    # visitor who has not signed in yet what your provider's hostname is; set a
#    # label like "Sign in with SSO" if you would rather it did not.
#    label: ""
#    timeoutMs: 5000
#
#  session:
#    # HMAC key for the session cookie, from LABVIEW_SESSION_SECRET. Unset means one
#    # is generated at startup, so every restart signs everyone out.
#    secret: ""
#    ttlMinutes: 720
#    cookieName: labview_session
#    # auto marks the cookie Secure when the request arrived over https (reading
#    # X-Forwarded-Proto). Override with "true"/"false" only if your proxy does not
#    # set that header — a Secure cookie over plain http is never stored, and the
#    # symptom is a login form that accepts the password and comes straight back.
#    secure: auto
#
#  # Failed sign-ins per username within the window, then a 429. Keyed on the
#  # username rather than the address: behind a tunnel and a reverse proxy every
#  # request shares one source address, so keying on it would lock out the fleet.
#  maxFailedAttempts: 5
#  lockoutSeconds: 60
