services:
  emby:
    image: emby/embyserver:4.8.8.0
    container_name: emby
    restart: unless-stopped
    # The Traefik exception: published via DockFlare (Cloudflare tunnel) but NOT
    # behind Traefik/Authentik — Emby uses its own built-in login.
    environment:
      UID: "1000"
      GID: "1000"
    networks:
      - default
      - proxy
    volumes:
      - ./config:/config
      - /mnt/media:/mnt/media:ro
    ports:
      - "8920:8096"
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=media.example.com"
      # The origin addresses this container's own published host port (8920), so the
      # tunnel reaches it directly — no reverse proxy in the path either way.
      - "dockflare.service=http://10.10.0.5:8920"
      - "dockflare.http2_origin=true"
      - "dockflare.match_sni_to_host=true"

networks:
  proxy:
    external: true
