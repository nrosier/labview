# Regression fixture: an expectation that agrees about the most exposed kind and
# disagrees about the rest.
#
# The sidecar beside this file expects `[traefik, lan]`. The scan classifies the
# service as `[traefik, internal]` — the same *first* kind, a different set. So a
# drift check that compared only the primary kind, or only the badge colour, would
# report nothing while the operator's expectation is wrong in both directions at
# once: `lan` was expected and is absent, `internal` was found and was not expected.
#
# `staledecl/` is the other half of this pair: there the primary kinds differ too, so
# it cannot tell a set comparison from a single-value one. This stack can.
#
# The route carries a middleware that resolves to the SSO defined in `authentik/`, so
# the service is protected. That is deliberate: this fixture is about the declaration
# layer, and an exposure finding here would make it about two things.
services:
  api:
    image: example/api:5.0.0
    container_name: partialdrift-api
    # Listens inside the container network only — `expose:` is the `internal` half of
    # the disagreement, and the absence of `ports:` is the missing `lan` half.
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdapi.rule=Host(`api.edge.example.com`)"
      - "traefik.http.routers.pdapi.entrypoints=websecure"
      - "traefik.http.routers.pdapi.middlewares=authentik@docker"
      - "traefik.http.services.pdapi.loadbalancer.server.port=8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
