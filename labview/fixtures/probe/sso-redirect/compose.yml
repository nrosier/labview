# Regression fixture: a redirect that leaves the origin is a gate.
#
# The shape of every external SSO hand-off there is — the service declined to serve the
# request itself and sent it to an identity provider on another host. Whatever is at the
# far end, this origin served nothing, and the probe does not follow the redirect to find
# out: where it points is the evidence, and following it would report the provider's page
# instead of this service's answer.
#
# No `tls` on the router, so this one is asked over plain http. The pair with
# `proxy-challenge` is what keeps the scheme rule honest in both directions.
services:
  crm:
    image: example/crm:3.0.0
    container_name: probe-sso-redirect
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ssoredirect.rule=Host(`crm.probe.example.com`)"
      - "traefik.http.routers.ssoredirect.entrypoints=web"

networks:
  proxy:
    external: true
