# One of four stacks on the same externally declared network. Nothing in this compose file
# can say that another stack's service backs this database up — compose `depends_on` reaches
# no further than its own project — so the sidecar beside it does, and that sidecar is the
# only reason a line is drawn between the two.
services:
  db-a:
    image: postgres:16-alpine
    networks:
      - backup

networks:
  backup:
    external: true
